<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Config Provider</title>
<!--
  이 UI는 본인이 복호화된 원본 평문을 직접 눈으로 확인하는 유일한 창구다 (스펙 §4.4).

  화면은 세 덩어리다: 얇은 상단 바 · 좌측 컬렉션 탐색기 · 우측 상세.
  가운데 표를 없앤 이유는 같은 정보를 두 번 그리기 때문이다 — 목록은 왼쪽이 맡고,
  값은 오른쪽 상세가 표로 보여준다. 값 표현은 여전히 전부 표다.

  외부 리소스를 하나도 쓰지 않는다(폰트·아이콘 CDN 포함). 이 페이지는 평문을 그리므로
  나가는 요청 경로를 만들지 않는다 — ui.ts의 CSP도 같은 기준으로 잠겨 있다.
-->
<style>
  :root {
    --bg: #f8f9fa; --panel: #ffffff; --panel-2: #fafbfc; --head: #f4f5f7;
    --line: #e4e5e7; --line-2: #d0d2d6; --text: #1e2022; --muted: #5a6068; --faint: #8b919a;
    --accent: #ff6c37; --accent-hover: #f05a24; --accent-soft: #fff2ec; --accent-line: #ffc9b3;
    --ok: #047857; --ok-bg: #ecfdf5; --ok-line: #a7f3d0;
    --warn: #b45309; --warn-bg: #fffbeb; --warn-line: #fde68a;
    --info: #1d4ed8; --info-bg: #eff6ff; --info-line: #bfdbfe;
    --danger: #dc2626; --danger-bg: #fef2f2; --danger-line: #fecaca;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --topbar: 92px; --left: 464px;
    --shadow: 0 1px 2px rgba(16, 18, 22, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --panel: #1a1d23; --panel-2: #1f232b; --head: #20242c;
      --line: #2a2f39; --line-2: #3a4150; --text: #e6e8ee; --muted: #9aa3b2; --faint: #6f7787;
      --accent: #ff7a45; --accent-hover: #ff8a5b; --accent-soft: #2e1d15; --accent-line: #5c3524;
      --ok: #34d399; --ok-bg: #0f2a22; --ok-line: #1f5045;
      --warn: #fbbf24; --warn-bg: #2b2110; --warn-line: #57431a;
      --info: #60a5fa; --info-bg: #121f36; --info-line: #24406b;
      --danger: #f87171; --danger-bg: #2a1618; --danger-line: #5a2a2c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.5 -apple-system, "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  code, .mono { font-family: var(--mono); }

  /* ── 상단 바 ───────────────────────────────────────────────── */
  .topbar {
    position: fixed; inset: 0 0 auto 0; height: var(--topbar); z-index: 40;
    display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 8px; flex: none; width: 172px; white-space: nowrap; }
  .logo { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .brand b { font-size: 14px; letter-spacing: -.01em; display: block; }
  .brand small { font: 400 10.5px/1.4 var(--mono); color: var(--faint); }
  /* 상단은 한 줄 요약 대신 "무엇을 뜻하는 숫자인가"를 라벨로 붙인 카드로 보여준다. */
  .cards { display: flex; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
  .card {
    display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; flex: 1; max-width: 230px;
  }
  .card .label { font: 700 9.5px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .card .main { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .card .num { font: 700 17px/1.15 var(--mono); letter-spacing: -.02em; }
  .card .unit { font: 400 11px/1.2 var(--mono); color: var(--muted); white-space: nowrap; }
  .card .sub { font: 400 10.5px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.tone-ok { border-color: var(--ok-line); background: var(--ok-bg); }
  .card.tone-err { border-color: var(--danger-line); background: var(--danger-bg); }
  .envchips { display: flex; gap: 4px; flex-wrap: wrap; }
  .envchip {
    font: 600 10.5px/1.6 var(--mono); padding: 0 6px; border-radius: 4px;
    border: 1px solid var(--line-2); color: var(--muted); background: var(--panel);
  }
  .envchip.base { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .topactions { display: flex; align-items: center; gap: 6px; flex: none; }
  @media (max-width: 1400px) { .card.optional { display: none; } }
  /* 더 좁아지면 숫자 카드는 접는다. 항목 수는 좌측 하단(.treefoot)에도 있고,
     남겨야 하는 건 색으로 상태를 말하는 카드(tone-*)뿐이다. */
  @media (max-width: 1000px) { .card:not([class*="tone-"]) { display: none; } }
  .alertline {
    position: fixed; top: var(--topbar); left: 0; right: 0; z-index: 39; padding: 3px 12px;
    background: var(--danger-bg); border-bottom: 1px solid var(--danger-line); color: var(--danger);
    font: 400 11px/1.5 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── 버튼 · 배지 ───────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line-2); color: var(--text);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 500; box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--head); }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); }
  .btn.ghost:hover { background: var(--head); color: var(--text); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .iconbtn {
    display: inline-grid; place-items: center; width: 22px; height: 22px; cursor: pointer;
    border: 0; background: transparent; color: var(--muted); border-radius: 4px; padding: 0; flex: none;
  }
  .iconbtn:hover { background: var(--head); color: var(--text); }
  .iconbtn.hot:hover { background: var(--accent-soft); color: var(--accent); }
  .iconbtn.warn:hover { background: var(--danger-bg); color: var(--danger); }
  .badge {
    display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
    font: 600 10px/1.6 var(--mono); letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); background: var(--head);
  }
  .badge.secret { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .badge.public { color: var(--info); background: var(--info-bg); border-color: var(--info-line); }
  .badge.unset { color: var(--faint); background: transparent; border-style: dashed; }
  .badge.err { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-line); }
  .badge.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
  .badge.accent { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: currentColor; }

  /* ── 2패널 골격 ────────────────────────────────────────────── */
  /*
    행 크기를 minmax(0, 1fr)로 못 박는다. 기본값(auto)으로 두면 shell의 높이가
    inset으로 정해져 있는데도 행이 콘텐츠만큼 늘어나, 좌/우 패널이 화면 밖으로
    밀려나고 그 안의 overflow-y:auto는 "넘칠 게 없다"고 판단해 스크롤을 만들지 않는다.
    관리 키가 늘어날수록 아래쪽 키에 아예 닿을 수 없게 되는 원인이었다.
  */
  .shell {
    position: fixed; inset: var(--topbar) 0 0 0; display: grid;
    grid-template-columns: var(--left) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  }
  .shell.warned { top: calc(var(--topbar) + 22px); }
  /* 두 패널 모두 min-height:0 — 안쪽 스크롤 컨테이너가 부모를 밀어내지 못하게 한다. */
  .left { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .right { overflow-y: auto; overscroll-behavior: contain; background: var(--bg); min-width: 0; min-height: 0; }
  /* 창이 좁아지면 고정 폭 좌측 패널이 우측을 화면 밖으로 밀어낸다. 같은 사고의 가로 버전. */
  @media (max-width: 1000px) { :root { --left: 320px; } }
  @media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(120px, 40%) minmax(0, 1fr); } .left { border-right: 0; border-bottom: 1px solid var(--line); } }

  /* ── 좌측: 검색 + 컬렉션 트리 ──────────────────────────────── */
  .search { padding: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
  .searchbox { position: relative; flex: 1; }
  .searchbox .ico { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  #q {
    width: 100%; background: var(--head); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 26px 6px 28px; font-size: 12.5px; color: var(--text);
  }
  #q:focus { outline: none; background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #q-clear { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); }
  .tree { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 20px; }
  .treefoot {
    border-top: 1px solid var(--line); padding: 6px 10px; background: var(--panel-2);
    font: 400 11px/1.5 var(--mono); color: var(--faint); display: flex; gap: 8px; align-items: center;
  }
  .col-head {
    display: flex; align-items: center; gap: 5px; padding: 5px 8px; cursor: pointer; user-select: none;
    background: var(--head); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1;
  }
  .col-head .caret { color: var(--faint); transition: transform .12s; flex: none; }
  .col-head.collapsed .caret { transform: rotate(-90deg); }
  .col-head .name { font: 600 12px/1.5 -apple-system, system-ui, sans-serif; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-head .count { font: 500 10.5px/1.6 var(--mono); color: var(--faint); }
  .col-head .tools { display: flex; gap: 1px; opacity: 0; }
  .col-head:hover .tools { opacity: 1; }
  .col-head.drop { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .col-head input.rename {
    flex: 1; background: var(--panel); border: 1px solid var(--accent); border-radius: 4px;
    padding: 2px 6px; font: 600 12px/1.5 -apple-system, system-ui, sans-serif;
  }
  .keyrow {
    display: flex; align-items: center; gap: 7px; padding: 5px 10px 5px 22px; cursor: pointer;
    border-bottom: 1px solid var(--line); border-left: 2px solid transparent; min-width: 0;
  }
  .keyrow:hover { background: var(--panel-2); }
  .keyrow.on { background: var(--accent-soft); border-left-color: var(--accent); }
  .keyrow.dragging { opacity: .4; }
  .keyrow .kname { font: 600 12px/1.5 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keyrow.on .kname { color: var(--accent); }
  .keyrow .ksub { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keyrow .kmain { flex: 1; min-width: 0; }
  .envdots { display: flex; gap: 3px; flex: none; }
  .envdot {
    font: 600 9px/1.5 var(--mono); text-transform: uppercase; padding: 0 4px; border-radius: 3px;
    border: 1px solid var(--line); color: var(--faint); background: var(--panel-2);
  }
  .envdot.set { color: var(--ok); border-color: var(--ok-line); background: var(--ok-bg); }
  .envdot.bad { color: var(--danger); border-color: var(--danger-line); background: var(--danger-bg); }
  .empty { padding: 24px 16px; text-align: center; color: var(--faint); font-size: 12px; }

  /* ── 우측: 상세 ────────────────────────────────────────────── */
  .detail { padding: 14px 16px 40px; }
  /* 표를 2열로 나눠 각 표의 너비를 줄인다. 한 줄에 담기는 글자가 줄어 눈이 덜 움직인다. */
  .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 12px; }
  .detail-grid > .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (max-width: 1250px) { .detail-grid { grid-template-columns: minmax(0, 1fr); } }
  .detail-head { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .detail-head h1 { margin: 4px 0 0; font: 700 18px/1.25 var(--mono); color: var(--accent); word-break: break-all; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .section { min-width: 0; }
  .sechead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px;
    font: 700 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
  }
  table.kv { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  table.kv th, table.kv td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  table.kv thead th {
    background: var(--head); font: 700 11.5px/1.5 var(--mono); letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint);
  }
  table.kv tbody th { background: var(--panel-2); font: 500 13.5px/1.5 var(--mono); color: var(--muted); font-weight: 500; }
  table.kv tr:last-child th, table.kv tr:last-child td { border-bottom: 0; }
  table.kv td { font: 400 14px/1.55 var(--mono); word-break: break-all; }
  .val { font: 400 14px/1.55 var(--mono); word-break: break-all; }
  .val.masked { color: var(--muted); letter-spacing: 1.5px; }
  .val.plain { color: var(--ok); }
  .val.none { color: var(--faint); font-style: italic; }
  .val.bad { color: var(--danger); }
  .rowacts { display: flex; gap: 1px; justify-content: flex-end; }
  /* 클릭하면 그 자리에서 편집된다 — 편집 버튼을 따로 찾지 않는다. */
  .edit-target { cursor: text; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; display: block; min-height: 22px; }
  .edit-target:hover { background: var(--head); box-shadow: inset 0 0 0 1px var(--line-2); }
  .edit-target.locked { cursor: not-allowed; }
  .edit-target.locked:hover { background: transparent; box-shadow: none; }
  input.inline, textarea.inline {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--accent);
    border-radius: 4px; padding: 5px 7px; font: 400 14px/1.55 var(--mono); resize: vertical;
  }
  input.inline:focus, textarea.inline:focus { outline: none; box-shadow: 0 0 0 1px var(--accent); }
  select.pick {
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 5px;
    padding: 5px 7px; font: 400 13.5px/1.5 var(--mono); cursor: pointer; max-width: 100%;
  }
  .cmd { display: flex; align-items: center; gap: 6px; }
  .cmd code { flex: 1; min-width: 0; word-break: break-all; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 7px; }
  .err { color: var(--danger); font-size: 12.5px; margin-top: 6px; }
  a { color: var(--accent); }
  .blank { display: grid; place-items: center; height: 100%; color: var(--faint); text-align: center; padding: 40px; }

  /* ── 모달 · 토스트 ─────────────────────────────────────────── */
  .backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(12, 14, 18, .45); display: grid; place-items: center; padding: 20px; }
  .modal { width: min(680px, 100%); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .28); }
  .modal header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .modal header b { font-size: 13.5px; }
  .modal .body { padding: 12px 14px; display: grid; gap: 10px; }
  .modal footer { display: flex; gap: 6px; justify-content: flex-end; padding: 11px 14px; border-top: 1px solid var(--line); background: var(--panel-2); }
  .field { display: grid; gap: 4px; }
  .field > label { font: 700 9.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .field input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 5px;
    padding: 6px 8px; font: 400 12px/1.5 var(--mono); color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field .hint { font-size: 11px; color: var(--faint); }
  .radios { display: flex; gap: 6px; }
  .radio { flex: 1; display: flex; gap: 7px; align-items: flex-start; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 5px; cursor: pointer; }
  .radio.on { border-color: var(--accent); background: var(--accent-soft); }
  .radio b { font-size: 12px; }
  .radio span { font-size: 10.5px; color: var(--muted); display: block; }
  .doc h3 { font-size: 12.5px; margin: 14px 0 6px; }
  .doc h3:first-child { margin-top: 0; }
  .doc p { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
  .doc pre {
    margin: 0 0 8px; padding: 9px 11px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; font: 400 11.5px/1.6 var(--mono); overflow-x: auto; color: var(--text);
  }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 80; max-width: 70vw;
    background: var(--text); color: var(--bg); border-radius: 6px; padding: 8px 14px; font-size: 12.5px;
    opacity: 0; transition: opacity .15s; pointer-events: none; box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  }
  #toast.show { opacity: 1; }

  @media (max-width: 1100px) {
    :root { --left: 340px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" id="logo"></span>
    <div>
      <b>Config Provider</b>
      <small>로컬 설정 · 비밀값 금고</small>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="topactions">
    <button class="btn ghost" id="readme">README</button>
    <button class="btn" id="revealall"></button>
    <button class="btn" id="envcopy">.env 복사</button>
    <button class="btn" id="reload">reload</button>
    <button class="btn primary" id="new">새 항목</button>
  </div>
</header>

<div class="shell" id="shell">
  <aside class="left">
    <div class="search">
      <div class="searchbox">
        <span class="ico" id="qico"></span>
        <input id="q" placeholder="key · 별칭 · 설명 검색" autocomplete="off" spellcheck="false" autofocus />
        <span id="q-clear"></span>
      </div>
      <button class="btn" id="newcol" title="새 컬렉션">+ 컬렉션</button>
    </div>
    <div class="tree" id="tree"></div>
    <div class="treefoot" id="treefoot"></div>
  </aside>
  <main class="right" id="right"></main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
// 평문 값을 localStorage·sessionStorage에 절대 넣지 않는다. 상태는 메모리에만 둔다 (스펙 §4.4).
const state = {
  items: [], envs: [], defaultEnv: 'dev', degraded: false, status: null,
  collections: [], uncategorized: [], resourceTypes: [],
  q: '', selected: null, collapsed: new Set(), editing: null,
  revealed: new Set(), revealAllUntil: 0, revealTimer: null,
  clipboardTimer: null, toastTimer: null, drag: null,
};

const $ = (id) => document.getElementById(id);

/* ── 아이콘: 외부 아이콘 폰트를 쓰지 않는다 (CSP·오프라인) ─────────── */
const PATHS = {
  search: ['M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z', 'm16.5 16.5 4 4'],
  send: ['m3 11 18-8-8 18-2.5-7.5L3 11Z'],
  eye: ['M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z', 'M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z'],
  eyeoff: ['m3 3 18 18', 'M10.6 10.6a3 3 0 0 0 4.2 4.2', 'M9.9 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.1M6.5 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.9-.8'],
  copy: ['M9 9h10v12H9z', 'M5 15H4V3h12v1'],
  edit: ['M4 20h4L20 8l-4-4L4 16v4Z', 'm14 6 4 4'],
  trash: ['M4 7h16', 'M9 7V4h6v3', 'M6 7l1 13h10l1-13'],
  plus: ['M12 5v14', 'M5 12h14'],
  close: ['m6 6 12 12M18 6 6 18'],
  check: ['m5 13 4 4 10-10'],
  caret: ['m6 9 6 6 6-6'],
  lock: ['M6 11h12v9H6z', 'M9 11V8a3 3 0 0 1 6 0v3'],
  unlock: ['M6 11h12v9H6z', 'M9 11V8a3 3 0 0 1 5.8-1.7'],
  folder: ['M3 6h6l2 2h10v11H3z'],
  link: ['M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1', 'M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1'],
  alert: ['M12 8v5', 'M12 17h.01', 'M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z'],
  book: ['M4 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4z', 'M20 4h-4a3 3 0 0 0-2 5.2V20a2.5 2.5 0 0 1 2.5-2.5H20z'],
  drag: ['M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01'],
};
function icon(name, size = 14) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.8');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.flex = 'none';
  for (const d of PATHS[name] ?? []) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    svg.append(p);
  }
  return svg;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function iconBtn(name, title, onClick, extra = '') {
  const b = el('button', 'iconbtn' + (extra ? ' ' + extra : ''));
  b.type = 'button';
  b.title = title;
  b.append(icon(name, 13));
  b.onclick = (e) => { e.stopPropagation(); onClick(e); };
  return b;
}
function btn(label, onClick, className = 'btn', iconName) {
  const b = el('button', className);
  b.type = 'button';
  if (iconName) b.append(icon(iconName, 13));
  b.append(el('span', null, label));
  b.onclick = (e) => { e.stopPropagation(); onClick(e); };
  return b;
}

/* ── API ────────────────────────────────────────────────────── */
async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: body !== undefined ? { 'content-type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
    cache: 'no-store',
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || !json.ok) {
    const e = json?.error ?? {};
    throw new Error((e.message ?? `HTTP ${res.status}`) + (e.hint ? ' — ' + e.hint : ''));
  }
  return json.data;
}

const REF_RE = /\{\{\s*([A-Za-z_][A-Za-z0-9_]*)\s*\}\}/g;

/** 템플릿에서 참조 key를 뽑는다. 서버는 목록 응답에 refs를 싣지 않는다. */
function refsOf(template) {
  if (typeof template !== 'string') return [];
  return [...new Set([...template.matchAll(REF_RE)].map((m) => m[1]))];
}

/**
 * API 응답을 화면이 쓰는 모양으로 정규화한다.
 *
 * 서버는 치환 결과(values)와 원본 템플릿(rawValues)을 따로 준다. 편집은 항상 템플릿
 * 기준이어야 하므로(치환 결과를 저장하면 참조가 상수로 굳는다) 둘을 한 칸에 묶는다.
 */
function normalizeItem(it) {
  const values = {};
  for (const env of it.envs ?? []) {
    const v = it.values?.[env];
    if (!v) continue;
    const template = it.rawValues ? (it.rawValues[env] ?? null) : null;
    values[env] = {
      template,
      resolved: v.value,
      status: v.status === 'ok' ? 'set' : v.status, // set | unset | locked | error
      refs: refsOf(template),
      error: v.error,
    };
  }
  return {
    key: it.key,
    alias: it.alias ?? [],
    resource_type: it.resourceType ?? '',
    desc: it.desc ?? '',
    ref: it.ref ?? '',
    visibility: it.visibility,
    declared: it.declaredVisibility,
    locked: it.locked,
    version: it.version,
    values,
  };
}

async function load() {
  const [status, data, cols] = await Promise.all([
    api('GET', '/status'),
    api('GET', '/items?values=true'),
    api('GET', '/collections'),
  ]);
  state.status = status;
  state.items = data.items.map(normalizeItem);
  state.envs = status.envs?.length
    ? status.envs
    : [...new Set(state.items.flatMap((i) => Object.keys(i.values)))].sort();
  state.defaultEnv = status.defaultEnv ?? 'dev';
  state.degraded = status.mode !== 'full';
  state.resourceTypes = status.resourceTypes ?? [];
  state.collections = cols.collections;
  state.uncategorized = cols.uncategorized;
  if (state.selected && !state.items.some((i) => i.key === state.selected)) state.selected = null;
  renderAll();
}

/* ── 파생 계산 ──────────────────────────────────────────────── */
function itemOf(key) { return state.items.find((i) => i.key === key) ?? null; }
function isSecret(item) { return item.visibility === 'secret'; }
function revealActive() { return state.revealAllUntil > Date.now(); }
function isRevealed(item, env) {
  if (!isSecret(item)) return true;
  return revealActive() || state.revealed.has(`${item.key}::${env}`);
}
function matchesQuery(item, q) {
  if (!q) return true;
  const n = (s) => (s || '').normalize('NFC').toLowerCase().replace(/[\s_-]+/g, '');
  const needle = n(q);
  return n(item.key).includes(needle) || n(item.desc).includes(needle) ||
    n(item.resource_type).includes(needle) || item.alias.some((a) => n(a).includes(needle));
}
/** 컬렉션 + 미분류를 한 줄기로 만든다. 미분류는 저장되지 않는 파생 그룹이다. */
function groups() {
  const list = state.collections.map((c) => ({ name: c.name, keys: c.keys, real: true }));
  list.push({ name: '미분류', keys: state.uncategorized, real: false });
  return list;
}
function collectionOf(key) {
  return state.collections.find((c) => c.keys.includes(key))?.name ?? null;
}

/* ── 렌더 ───────────────────────────────────────────────────── */
function renderAll() {
  renderTop();
  renderTree();
  renderDetail();
}

function renderTop() {
  const s = state.status;
  const box = $('cards');
  box.textContent = '';

  // 카드마다 "이 숫자가 무엇인가"를 라벨로 먼저 말한다. 숫자만 나열하면 읽는 사람이
  // 매번 뜻을 되짚어야 하고, 그 되짚음이 이 화면에서 가장 자주 일어나는 낭비였다.
  const card = (opts) => {
    const c = el('div', 'card' + (opts.tone ? ' tone-' + opts.tone : '') + (opts.optional ? ' optional' : ''));
    c.append(el('div', 'label', opts.label));
    if (opts.body) {
      c.append(opts.body);
    } else {
      const main = el('div', 'main');
      main.append(el('span', 'num', opts.num));
      if (opts.unit) main.append(el('span', 'unit', opts.unit));
      c.append(main);
    }
    if (opts.sub) c.append(el('div', 'sub', opts.sub));
    if (opts.title) c.title = opts.title;
    box.append(c);
  };

  const secrets = state.items.filter(isSecret).length;
  card({
    label: '저장된 항목',
    num: String(state.items.length),
    unit: '개',
    sub: `공개 ${state.items.length - secrets} · 비밀 ${secrets}`,
    title: 'public.yaml과 secret.yaml에 정의된 key의 수',
  });

  const unset = state.items.filter((i) => Object.values(i.values).some((v) => v.status === 'unset')).length;
  const broken = state.items.filter((i) => Object.values(i.values).some((v) => v.status === 'error' || v.status === 'locked')).length;
  card({
    label: '손볼 항목',
    num: String(unset + broken),
    unit: '개',
    sub: `미설정 ${unset} · 문제 ${broken}`,
    tone: broken ? 'err' : undefined,
    title: '값이 비어 있거나(미설정) 치환에 실패한 항목',
  });

  const envs = el('div', 'envchips');
  for (const env of state.envs) {
    const chip = el('span', 'envchip' + (env === state.defaultEnv ? ' base' : ''), env);
    chip.title = env === state.defaultEnv ? '기본 env — 조회에서 생략하면 이 값이 쓰인다' : env;
    envs.append(chip);
  }
  if (state.envs.length === 0) envs.append(el('span', 'envchip', '없음'));
  card({
    label: '환경',
    body: envs,
    sub: `기본 ${state.defaultEnv} — 생략하면 이 env`,
    title: 'env를 생략한 조회가 어디를 보는지. prod는 항상 명시적이어야 한다',
    optional: true,
  });

  card({
    label: '비밀값 읽기',
    num: state.degraded ? '잠김' : '가능',
    sub: state.degraded ? 'age 개인키를 찾지 못했습니다' : 'age 키로 복호화됨',
    tone: state.degraded ? 'err' : 'ok',
    title: state.degraded ? (s?.degradedReason ?? '') : 'secret.yaml의 값을 평문으로 볼 수 있는 상태',
  });

  card({
    label: '마지막 읽기',
    num: s ? new Date(s.loadedAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '—',
    sub: '파일을 고쳤다면 reload',
    optional: true,
    title: '데몬이 저장소 파일을 읽어들인 시각',
  });

  const reveal = $('revealall');
  reveal.textContent = '';
  const on = revealActive();
  reveal.append(icon(on ? 'eyeoff' : 'eye', 13));
  reveal.append(el('span', null, on ? `가리기 ${Math.ceil((state.revealAllUntil - Date.now()) / 1000)}s` : '전체 보기'));

  // 축소 모드나 경고는 평소에 자리를 차지하지 않는다 — 문제일 때만 한 줄 나타난다.
  const old = document.querySelector('.alertline');
  if (old) old.remove();
  const warnings = [s?.degradedReason, ...(s?.warnings ?? [])].filter(Boolean);
  $('shell').classList.toggle('warned', warnings.length > 0);
  if (warnings.length) {
    const line = el('div', 'alertline', `⚠ ${warnings.join(' · ')}`);
    document.body.insertBefore(line, $('shell'));
  }
}

function renderTree() {
  const tree = $('tree');
  tree.textContent = '';
  const q = state.q.trim();
  let shown = 0;

  for (const group of groups()) {
    const items = group.keys
      .map(itemOf)
      .filter((it) => it && matchesQuery(it, q))
      .sort((a, b) => a.key.localeCompare(b.key));
    // 검색 중에는 빈 컬렉션을 접어둔 채 남기지 않는다 — 결과만 보이는 게 낫다.
    if (q && items.length === 0) continue;
    shown += items.length;
    // 검색 중에는 접힘 상태를 무시한다 — 결과가 접힌 컬렉션 안에 있으면 아무것도 안 보인다.
    const collapsed = state.collapsed.has(group.name) && !q;
    tree.append(collectionHead(group, items.length, collapsed));
    if (collapsed) continue;
    if (items.length === 0) {
      const hint = el('div', 'empty', group.real ? '비어 있습니다. 키를 끌어다 놓으세요.' : '모든 키가 컬렉션에 들어 있습니다.');
      hint.style.padding = '10px';
      tree.append(hint);
      continue;
    }
    for (const item of items) tree.append(keyRow(item));
  }

  if (tree.childElementCount === 0) {
    tree.append(el('div', 'empty', q ? `'${q}'에 맞는 항목이 없습니다.` : '항목이 없습니다. dkc init으로 저장소를 만드세요.'));
  }

  const foot = $('treefoot');
  foot.textContent = '';
  foot.append(el('span', null, q ? `${shown}개 검색됨 / 전체 ${state.items.length}개` : `${state.items.length}개 항목 · 컬렉션 ${state.collections.length}개`));
}

function collectionHead(group, count, collapsed) {
  const head = el('div', 'col-head' + (collapsed ? ' collapsed' : ''));
  head.append(icon('caret', 13));
  head.firstChild.classList.add('caret');
  head.append(icon(group.real ? 'folder' : 'link', 13));
  head.lastChild.style.color = 'var(--faint)';

  if (state.editing === `col:${group.name}`) {
    const input = el('input', 'rename');
    input.value = group.name;
    // Enter로 저장하면 곧바로 다시 그려지면서 blur가 한 번 더 뜬다. 두 번 저장하면
    // 두 번째는 "없는 컬렉션"이 되어 엉뚱한 에러가 뜬다.
    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      const name = input.value.trim();
      state.editing = null;
      if (!name || name === group.name) return renderTree();
      act(() => api('PUT', `/collections/${encodeURIComponent(group.name)}`, { name }), `컬렉션 이름을 ${name}으로 바꿨습니다`);
    };
    input.onkeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') { done = true; state.editing = null; renderTree(); }
    };
    input.onblur = commit;
    input.onclick = (e) => e.stopPropagation();
    head.append(input);
    setTimeout(() => { input.focus(); input.select(); }, 0);
  } else {
    head.append(el('span', 'name', group.name));
    head.append(el('span', 'count', String(count)));
    if (group.real) {
      const tools = el('div', 'tools');
      tools.append(iconBtn('edit', '이름 바꾸기', () => { state.editing = `col:${group.name}`; renderTree(); }));
      tools.append(iconBtn('trash', '컬렉션 삭제 (키는 지워지지 않습니다)', () => {
        if (!confirm(`컬렉션 '${group.name}'을 지울까요?\n\n안에 있는 키는 지워지지 않고 미분류로 돌아갑니다.`)) return;
        act(() => api('DELETE', `/collections/${encodeURIComponent(group.name)}`), `컬렉션 '${group.name}'을 지웠습니다`);
      }, 'warn'));
      head.append(tools);
    }
  }

  head.onclick = () => {
    state.collapsed.has(group.name) ? state.collapsed.delete(group.name) : state.collapsed.add(group.name);
    renderTree();
  };

  // 드롭 대상: 컬렉션 헤더에 키를 떨어뜨리면 그 컬렉션으로 옮긴다.
  head.ondragover = (e) => { if (state.drag) { e.preventDefault(); head.classList.add('drop'); } };
  head.ondragleave = () => head.classList.remove('drop');
  head.ondrop = (e) => {
    e.preventDefault();
    head.classList.remove('drop');
    const key = state.drag;
    state.drag = null;
    if (!key) return;
    dropInto(group, key);
  };
  return head;
}

function dropInto(group, key) {
  const from = collectionOf(key);
  if ((group.real ? group.name : null) === from) return;
  if (group.real) {
    act(() => api('PUT', `/collections/${encodeURIComponent(group.name)}/keys/${encodeURIComponent(key)}`), `${key}를 '${group.name}'으로 옮겼습니다`);
  } else {
    act(() => api('DELETE', `/collections/${encodeURIComponent(from)}/keys/${encodeURIComponent(key)}`), `${key}를 미분류로 옮겼습니다`);
  }
}

function keyRow(item) {
  const row = el('div', 'keyrow' + (state.selected === item.key ? ' on' : ''));
  row.draggable = true;
  row.ondragstart = (e) => {
    state.drag = item.key;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', item.key);
  };
  row.ondragend = () => { row.classList.remove('dragging'); state.drag = null; };
  row.onclick = () => { state.selected = item.key; state.editing = null; renderTree(); renderDetail(); };

  row.append(icon(isSecret(item) ? 'lock' : 'unlock', 13));
  row.firstChild.style.color = isSecret(item) ? 'var(--warn)' : 'var(--faint)';

  const main = el('div', 'kmain');
  main.append(el('div', 'kname', item.key));
  main.append(el('div', 'ksub', item.alias.join(' · ') || '별칭 없음'));
  row.append(main);

  const dots = el('div', 'envdots');
  for (const env of state.envs) {
    const v = item.values[env];
    const tone = !v ? '' : v.status === 'set' ? ' set' : (v.status === 'unset' ? '' : ' bad');
    const dot = el('span', 'envdot' + tone, env.slice(0, 4));
    dot.title = !v ? `${env}: 정의 없음` : `${env}: ${v.status}`;
    dots.append(dot);
  }
  row.append(dots);
  return row;
}

/* ── 우측 상세: 값·메타·별칭·참조·CLI를 모두 표로 고정한다 ────────── */
function renderDetail() {
  const right = $('right');
  right.textContent = '';
  const item = state.selected ? itemOf(state.selected) : null;

  if (!item) {
    const blank = el('div', 'blank');
    const box = el('div');
    box.append(icon('folder', 26));
    box.append(el('div', null, '왼쪽에서 키를 고르면 값·메타·참조·CLI 사용법이 여기에 표로 나옵니다.'));
    box.append(el('div', 'note', '표의 값을 클릭하면 그 자리에서 편집됩니다. 키를 끌어 컬렉션에 넣을 수 있습니다.'));
    blank.append(box);
    right.append(blank);
    return;
  }

  const wrap = el('div', 'detail');
  const head = el('div', 'detail-head');
  const left = el('div');
  left.style.minWidth = '0';
  const badges = el('div', 'badges');
  badges.append(el('span', 'badge ' + (isSecret(item) ? 'secret' : 'public'), item.visibility));
  if (item.declared !== item.visibility) {
    const b = el('span', 'badge', `선언 ${item.declared}`);
    b.title = '참조를 통해 secret이 섞여 실효 민감도가 올라갔습니다';
    badges.append(b);
  }
  if (item.locked) badges.append(el('span', 'badge err', '값 잠김'));
  left.append(badges, el('h1', null, item.key));
  head.append(left);

  const acts = el('div', 'rowacts');
  acts.style.marginLeft = 'auto';
  acts.append(iconBtn('copy', 'key 이름 복사', () => copyText(item.key, false)));
  acts.append(iconBtn('close', '닫기', () => { state.selected = null; renderTree(); renderDetail(); }));
  head.append(acts);
  wrap.append(head);

  const grid = el('div', 'detail-grid');
  const colA = el('div', 'col');
  const colB = el('div', 'col');
  colA.append(valueSection(item));
  const refs = refSection(item);
  if (refs) colA.append(refs);
  colA.append(cliSection(item));
  colB.append(metaSection(item));
  colB.append(aliasSection(item));
  grid.append(colA, colB);
  wrap.append(grid);
  right.append(wrap);
}

function section(title, action) {
  const box = el('div', 'section');
  const head = el('div', 'sechead');
  head.append(el('span', null, title));
  if (action) head.append(action);
  box.append(head);
  return box;
}

function kvTable(rows, headers, widths) {
  const table = el('table', 'kv');
  if (widths) {
    const cg = el('colgroup');
    for (const w of widths) {
      const c = el('col');
      if (w) c.style.width = w;
      cg.append(c);
    }
    table.append(cg);
  }
  if (headers) {
    const thead = el('thead');
    const tr = el('tr');
    for (const h of headers) tr.append(el('th', null, h));
    thead.append(tr);
    table.append(thead);
  }
  const tbody = el('tbody');
  for (const row of rows) {
    const tr = el('tr');
    row.forEach((cell, i) => {
      const td = el(!headers && i === 0 ? 'th' : 'td');
      if (typeof cell === 'string') td.textContent = cell;
      else if (cell) td.append(cell);
      tr.append(td);
    });
    tbody.append(tr);
  }
  table.append(tbody);
  return table;
}

/** 드롭다운 하나를 만든다. 컬렉션·종류가 같은 모양을 쓴다. */
function selectBox(options, value, onChange) {
  const pick = el('select', 'pick');
  for (const opt of options) {
    const node = el('option', null, opt.label);
    node.value = opt.value;
    pick.append(node);
  }
  pick.value = value;
  pick.onchange = () => onChange(pick.value);
  return pick;
}

/**
 * 종류(resource_type) 선택지.
 *
 * 자유 입력을 두지 않는 이유는 같은 개념이 여러 철자로 갈라지기 때문이다.
 * 다만 파일에 이미 들어 있는 목록 밖의 값은 지우지 않고 선택지에 남긴다 —
 * 화면을 열었다는 이유로 저장소의 값이 조용히 바뀌면 안 된다.
 */
function typeOptions(current) {
  const options = [{ value: '', label: '— 지정 안 함' }, ...state.resourceTypes.map((t) => ({ value: t.value, label: `${t.label} (${t.value})` }))];
  if (current && !state.resourceTypes.some((t) => t.value === current)) {
    options.push({ value: current, label: `${current} (등록 외 · 파일에 있던 값)` });
  }
  return options;
}

/**
 * 클릭하면 그 자리에서 편집되는 셀.
 *
 * 편집 버튼을 따로 두지 않는 이유: 이 화면에서 하는 일의 대부분이 "보다가 고치는 것"인데,
 * 버튼을 찾는 단계가 그 사이에 끼면 매번 한 번씩 더 멈추게 된다.
 */
function editable(display, opts) {
  const id = opts.id;
  if (state.editing === id) {
    const input = el('input', 'inline');
    input.value = opts.value ?? '';
    if (opts.placeholder) input.placeholder = opts.placeholder;
    let done = false;
    const commit = () => {
      if (done) return;
      done = true;
      const next = input.value;
      state.editing = null;
      if (next === (opts.value ?? '')) return renderDetail();
      opts.onSave(next);
    };
    input.onkeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') { done = true; state.editing = null; renderDetail(); }
    };
    input.onblur = commit;
    setTimeout(() => { input.focus(); input.select(); }, 0);
    return input;
  }
  const node = el('div', 'edit-target' + (opts.locked ? ' locked' : ''));
  node.append(display);
  node.title = opts.locked ? (opts.lockedReason ?? '') : '클릭해서 편집';
  if (!opts.locked) node.onclick = () => { state.editing = id; renderDetail(); };
  return node;
}

function valueSection(item) {
  const anySecret = isSecret(item);
  const allShown = state.envs.every((e) => isRevealed(item, e));
  const toggle = anySecret
    ? btn(allShown ? '모두 가리기' : '모두 보기', () => {
        for (const env of state.envs) {
          const id = `${item.key}::${env}`;
          allShown ? state.revealed.delete(id) : state.revealed.add(id);
        }
        renderDetail();
      }, 'btn ghost')
    : null;
  const box = section('환경별 값 · 클릭해서 편집', toggle);

  const TONE = { set: 'ok', unset: 'unset', locked: 'err', error: 'err' };
  const rows = [];
  for (const env of state.envs) {
    const value = item.values[env];
    const envCell = el('span', 'badge ' + (env === 'prod' ? 'secret' : 'public'), env);

    // env가 아예 정의되지 않은 경우에도 값을 넣을 수 있다 — 넣는 순간 그 env가 생긴다.
    if (!value) {
      rows.push([
        envCell,
        el('span', 'badge unset', '정의 없음'),
        editable(el('span', 'val none', '값을 넣으면 이 env가 생깁니다'), {
          id: `val:${item.key}::${env}`, value: '',
          placeholder: '값 · 참조는 {{OTHER_KEY}}',
          onSave: (v) => putValue(item, env, v),
        }),
        el('span'),
      ]);
      continue;
    }

    const revealed = isRevealed(item, env);
    const display = valueDisplay(item, value, revealed);
    if (value.status === 'set' && revealed && anySecret) display.style.color = 'var(--ok)';

    const cell = editable(display, {
      id: `val:${item.key}::${env}`,
      value: value.template ?? '',
      placeholder: '값 · 참조는 {{OTHER_KEY}}',
      // 편집은 항상 템플릿(원본) 기준이다. 잠긴 값은 원본을 모르므로 손대지 못하게 막는다.
      locked: value.status === 'locked',
      lockedReason: '축소 모드입니다 — 원본을 모르는 채로 덮어쓰면 값이 사라집니다',
      onSave: (v) => putValue(item, env, v),
    });

    const acts = el('div', 'rowacts');
    if (anySecret && value.status === 'set') {
      acts.append(iconBtn(revealed ? 'eyeoff' : 'eye', revealed ? '가리기' : '평문 보기', () => {
        const id = `${item.key}::${env}`;
        state.revealed.has(id) ? state.revealed.delete(id) : state.revealed.add(id);
        renderDetail();
      }));
    }
    if (value.status === 'set' && value.resolved !== null) {
      acts.append(iconBtn('copy', '값 복사 (30초 뒤 클립보드 비움)', () => copyValue(value.resolved), 'hot'));
    }
    if (value.status === 'set') {
      acts.append(iconBtn('trash', '미설정(null)으로 되돌리기', () => {
        if (!confirm(`${item.key}(${env})를 미설정으로 되돌릴까요?`)) return;
        putValue(item, env, null);
      }, 'warn'));
    }
    rows.push([envCell, el('span', 'badge ' + TONE[value.status], value.status), cell, acts]);
  }

  box.append(kvTable(rows, ['env', '상태', '값', ''], ['74px', '78px', null, '84px']));
  for (const env of state.envs) {
    const v = item.values[env];
    if (v && v.status === 'error') box.append(el('div', 'err', `${env}: ${v.error}`));
  }
  return box;
}

function valueDisplay(item, value, revealed) {
  if (value.status === 'unset') return el('span', 'val none', '미설정 (null)');
  if (value.status === 'locked') return el('span', 'val none', '잠김 (축소 모드)');
  if (value.status === 'error') return el('span', 'val bad', `치환 실패 · ${value.error ?? ''}`);
  if (revealed) return el('span', 'val ' + (isSecret(item) ? 'plain' : ''), value.resolved === '' ? '(빈 문자열)' : value.resolved ?? '');
  return el('span', 'val masked', maskOf(value.resolved));
}

function refSection(item) {
  const rows = [];
  for (const env of state.envs) {
    const value = item.values[env];
    if (!value || value.refs.length === 0 || !value.template) continue;
    // 템플릿 마스킹 기준은 실효 visibility가 아니라 declared다. public으로 선언된 항목의
    // 템플릿에는 참조 '이름'만 들어 있고 비밀값은 없다 — 가리면 정보만 잃는다.
    const hide = item.declared === 'secret' && !isRevealed(item, env);
    const links = el('div');
    links.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap';
    for (const ref of value.refs) {
      const chip = el('button', 'badge accent', ref);
      chip.type = 'button';
      chip.style.cursor = 'pointer';
      chip.onclick = () => { state.selected = ref; state.editing = null; renderTree(); renderDetail(); };
      links.append(chip);
    }
    rows.push([el('span', 'badge', env), el('span', 'val', hide ? maskOf(value.template) : value.template), links]);
  }
  if (rows.length === 0) return null;
  const box = section('참조 · 원본 템플릿');
  box.append(kvTable(rows, ['env', '템플릿', '참조 key'], ['74px', null, '34%']));
  box.append(el('div', 'note', '편집은 항상 템플릿 기준입니다. 치환 결과를 저장하면 참조가 상수로 굳습니다.'));
  return box;
}

function metaSection(item) {
  const box = section('메타데이터 · 클릭해서 편집');
  const meta = (label, field, value, placeholder) =>
    [label, editable(el('span', 'val' + (value ? '' : ' none'), value || '—'), {
      id: `meta:${item.key}:${field}`,
      value,
      placeholder,
      onSave: (v) => patchMeta(item, { [field]: v.trim() || null }),
    })];

  const linkCell = () => {
    if (!item.ref) return el('span', 'val none', '—');
    const box2 = el('span');
    const a = el('a', null, item.ref);
    a.href = item.ref;
    a.target = '_blank';
    a.rel = 'noreferrer noopener';
    a.onclick = (e) => e.stopPropagation();
    box2.append(a);
    return box2;
  };

  const collectionPick = selectBox(
    [{ value: '', label: '미분류' }, ...state.collections.map((c) => ({ value: c.name, label: c.name }))],
    collectionOf(item.key) ?? '',
    (name) => {
      const from = collectionOf(item.key);
      if (name) act(() => api('PUT', `/collections/${encodeURIComponent(name)}/keys/${encodeURIComponent(item.key)}`), `'${name}'으로 옮겼습니다`);
      else if (from) act(() => api('DELETE', `/collections/${encodeURIComponent(from)}/keys/${encodeURIComponent(item.key)}`), '미분류로 옮겼습니다');
    },
  );

  const typePick = selectBox(typeOptions(item.resource_type), item.resource_type ?? '', (value) =>
    patchMeta(item, { resource_type: value || null }));

  const rows = [
    ['key', el('span', 'val', item.key)],
    ['컬렉션', collectionPick],
    ['종류', typePick],
    meta('설명', 'desc', item.desc, '이 값이 무엇인지 한 줄로'),
    ['참고', editable(linkCell(), {
      id: `meta:${item.key}:ref`, value: item.ref, placeholder: 'https://…',
      onSave: (v) => patchMeta(item, { ref: v.trim() || null }),
    })],
    ['선언', el('span', 'badge ' + (item.declared === 'secret' ? 'secret' : 'public'), `${item.declared}.yaml`)],
    ['version', el('span', 'val', item.version)],
  ];
  box.append(kvTable(rows, null, ['104px', null]));
  return box;
}

function aliasSection(item) {
  const add = btn('추가', () => {
    const alias = prompt(`${item.key}에 추가할 별칭`);
    if (alias && alias.trim()) act(() => api('POST', `/alias/${encodeURIComponent(item.key)}`, { alias: alias.trim() }), '별칭을 추가했습니다');
  }, 'btn ghost', 'plus');
  const box = section(`별칭 (${item.alias.length}) · 에이전트가 이 말로 key를 찾는다`, add);

  if (item.alias.length === 0) {
    box.append(kvTable([[el('span', 'val none', '별칭이 없습니다'), el('span')]], ['별칭', ''], [null, '32px']));
    return box;
  }
  const rows = item.alias.map((alias, i) => {
    const cell = editable(el('span', 'val', alias), {
      id: `alias:${item.key}:${i}`,
      value: alias,
      onSave: (v) => {
        const next = [...item.alias];
        if (v.trim()) next[i] = v.trim();
        else next.splice(i, 1);
        patchMeta(item, { alias: next });
      },
    });
    const del = el('div', 'rowacts');
    del.append(iconBtn('trash', '별칭 삭제', () => act(
      () => api('DELETE', `/alias/${encodeURIComponent(item.key)}/${encodeURIComponent(alias)}`),
      '별칭을 삭제했습니다',
    ), 'warn'));
    return [cell, del];
  });
  box.append(kvTable(rows, ['별칭', ''], [null, '40px']));
  return box;
}

function cliSection(item) {
  const env = state.defaultEnv;
  const commands = [
    ['값 조회', `dkc get ${item.key} --env ${env}`],
    ['템플릿 원본', `dkc get ${item.key} --env ${env} --raw`],
    ['env 주입 실행', `dkc exec --with ${item.key} --env ${env} -- <명령>`],
    ['별칭 검색', `dkc resolve "${item.alias[0] ?? item.key}"`],
  ];
  const box = section('CLI 사용법');
  const rows = commands.map(([label, cmd]) => {
    const line = el('div', 'cmd');
    line.append(el('code', null, cmd));
    line.append(iconBtn('copy', '명령 복사', () => copyText(cmd, false), 'hot'));
    return [label, line];
  });
  box.append(kvTable(rows, ['용도', '명령'], ['118px', null]));
  box.append(el('div', 'note', '값을 에이전트 컨텍스트에 남기지 않으려면 get 대신 exec를 쓰세요 (스펙 §4.3).'));
  return box;
}

/* ── 쓰기 ───────────────────────────────────────────────────── */
function putValue(item, env, value) {
  return act(
    () => api('PUT', `/value/${encodeURIComponent(item.key)}`, { env, value, version: item.version }),
    value === null ? `${item.key}(${env})를 미설정으로 바꿨습니다` : `${item.key}(${env})를 저장했습니다`,
  );
}

/** 메타 편집은 alias 경로 하나로 모인다. key와 value는 이 경로로 바뀌지 않는다 (스펙 §4.5). */
function patchMeta(item, fields) {
  return act(
    () => api('PUT', `/alias/${encodeURIComponent(item.key)}`, { version: item.version, ...fields }),
    `${item.key}를 저장했습니다`,
  );
}

/* ── 모달 ───────────────────────────────────────────────────── */
function openModal(title, buildBody, onSubmit, submitLabel) {
  const root = $('modal-root');
  root.textContent = '';
  const backdrop = el('div', 'backdrop');
  const modal = el('div', 'modal');
  const header = el('header');
  header.append(el('b', null, title));
  const x = iconBtn('close', '닫기', () => closeModal());
  x.style.marginLeft = 'auto';
  header.append(x);
  const body = el('div', 'body');
  buildBody(body);

  if (onSubmit) {
    const form = el('form');
    form.onsubmit = (e) => { e.preventDefault(); onSubmit(); };
    const foot = el('footer');
    foot.append(btn('취소', () => closeModal(), 'btn'));
    const submit = el('button', 'btn primary');
    submit.type = 'submit';
    submit.textContent = submitLabel ?? '저장';
    foot.append(submit);
    form.append(body, foot);
    modal.append(header, form);
  } else {
    modal.append(header, body);
  }
  backdrop.append(modal);
  backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
  root.append(backdrop);
  const first = body.querySelector('input, textarea');
  if (first) setTimeout(() => first.focus(), 0);
}
function closeModal() { $('modal-root').textContent = ''; }
function modalOpen() { return $('modal-root').childElementCount > 0; }

function field(label, hint) {
  const box = el('div', 'field');
  box.append(el('label', null, label));
  const input = el('input');
  input.type = 'text';
  box.append(input);
  if (hint) box.append(el('div', 'hint', hint));
  return { box, input };
}

function openNewCollection() {
  const name = field('컬렉션 이름', '키를 묶는 폴더입니다. 값은 들어가지 않습니다');
  openModal('새 컬렉션', (body) => body.append(name.box), () => {
    const value = name.input.value.trim();
    if (!value) return toast('⚠️ 이름을 입력하세요');
    act(() => api('POST', '/collections', { name: value }), `컬렉션 '${value}'을 만들었습니다`);
  }, '만들기');
}

function openNewItem() {
  const key = field('key', '영문/숫자/밑줄. 숫자로 시작할 수 없습니다');
  let type = '';
  const alias = field('별칭', '쉼표로 구분. 에이전트가 이 말로 key를 찾습니다');
  const desc = field('설명', '선택');
  const refUrl = field('참고 링크', '선택. 콘솔·문서 URL');
  const envs = state.envs.length ? state.envs : ['prod', 'dev'];
  const valueInputs = new Map();
  let visibility = 'public';
  let collection = state.selected ? collectionOf(state.selected) ?? '' : '';

  openModal('새 항목', (body) => {
    body.append(key.box);

    const vis = el('div', 'field');
    vis.append(el('label', null, '저장 위치'));
    const radios = el('div', 'radios');
    const make = (value, title, note) => {
      const r = el('label', 'radio' + (visibility === value ? ' on' : ''));
      const input = el('input');
      input.type = 'radio';
      input.name = 'vis';
      input.checked = visibility === value;
      input.onchange = () => {
        visibility = value;
        radios.querySelectorAll('.radio').forEach((n) => n.classList.remove('on'));
        r.classList.add('on');
      };
      const text = el('div');
      text.append(el('b', null, title), el('span', null, note));
      r.append(input, text);
      radios.append(r);
    };
    make('public', 'public.yaml', '평문 저장 · 호스트, 포트, 사용자명');
    make('secret', 'secret.yaml', 'sops+age 암호화 · 비밀번호, API 키');
    vis.append(radios);
    body.append(vis);

    const colBox = el('div', 'field');
    colBox.append(el('label', null, '컬렉션'));
    const pick = el('select', 'pick');
    const none = el('option', null, '미분류');
    none.value = '';
    pick.append(none);
    for (const c of state.collections) {
      const opt = el('option', null, c.name);
      opt.value = c.name;
      pick.append(opt);
    }
    pick.value = collection;
    pick.onchange = () => { collection = pick.value; };
    colBox.append(pick);

    const typeBox = el('div', 'field');
    typeBox.append(el('label', null, '종류'));
    typeBox.append(selectBox(typeOptions(''), '', (v) => { type = v; }));
    typeBox.append(el('div', 'hint', '등록된 카테고리 중에서 고릅니다. 같은 개념이 여러 철자로 갈라지지 않게 합니다'));
    body.append(colBox, typeBox, alias.box, desc.box, refUrl.box);

    const valueBox = el('div', 'field');
    valueBox.append(el('label', null, '초기 값 (비우면 미설정)'));
    const rows = envs.map((env) => {
      const input = el('input');
      input.type = 'text';
      input.placeholder = '값 · 참조는 {{OTHER_KEY}}';
      input.style.cssText = 'width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:4px;padding:4px 6px;font:400 12px/1.5 var(--mono);color:var(--text)';
      valueInputs.set(env, input);
      return [env, input];
    });
    valueBox.append(kvTable(rows, null, ['72px', null]));
    body.append(valueBox);
  }, () => {
    const name = key.input.value.trim();
    if (!name) return toast('⚠️ key를 입력하세요');
    const filled = [...valueInputs].filter(([, input]) => input.value.trim() !== '');
    act(async () => {
      await api('POST', '/items', {
        key: name,
        visibility,
        resource_type: type || null,
        alias: alias.input.value.split(',').map((a) => a.trim()).filter(Boolean),
        desc: desc.input.value.trim() || null,
        ref: refUrl.input.value.trim() || null,
      });
      // 생성 API는 값을 받지 않는다(항상 prod/dev = null). 값은 만든 뒤 env마다 채운다.
      // 매번 version이 바뀌므로 직전 응답의 version을 이어 쓴다.
      let version = (await api('GET', `/alias/${encodeURIComponent(name)}`)).version;
      for (const [env, input] of filled) {
        version = (await api('PUT', `/value/${encodeURIComponent(name)}`, { env, value: input.value, version })).version;
      }
      if (collection) await api('PUT', `/collections/${encodeURIComponent(collection)}/keys/${encodeURIComponent(name)}`);
    }, `${name}를 만들었습니다` + (filled.length ? ` · 값 ${filled.length}개를 채웠습니다` : ''), () => { state.selected = name; });
  }, '만들기');
}

/* ── 값 다루기 ──────────────────────────────────────────────── */
function maskOf(value) {
  return value === null || value === undefined ? '' : '●'.repeat(Math.min(24, Math.max(8, value.length)));
}

/**
 * .env 형식으로 클립보드에 복사한다. **파일로 내려받지 않는다** — 다운로드는
 * 평문을 디스크에 남기고, 그 순간 이 툴의 저장 경계가 무의미해진다 (스펙 §4.4).
 */
function copyEnvFile() {
  const env = state.defaultEnv;
  const q = state.q.trim();
  const keys = state.items.filter((i) => matchesQuery(i, q)).map((i) => i.key);
  const lines = [];
  let skipped = 0;
  for (const key of keys) {
    const value = itemOf(key)?.values[env];
    if (!value || value.status !== 'set' || value.resolved === null) { skipped++; continue; }
    lines.push(`${key}=${/[\s"'#$]/.test(value.resolved) ? JSON.stringify(value.resolved) : value.resolved}`);
  }
  if (lines.length === 0) return toast(`⚠️ ${env}에 복사할 값이 없습니다`);
  const secrets = keys.filter((k) => itemOf(k) && isSecret(itemOf(k))).length;
  if (!confirm(`${env} 환경의 ${lines.length}개 값을 클립보드로 복사합니다.\n(secret ${secrets}개 포함)\n\n계속할까요?`)) return;
  copyValue(lines.join('\n'), `${lines.length}개를 .env 형식으로 복사했습니다` + (skipped ? ` (미설정 ${skipped}개 제외)` : ''));
}

/** 복사 후 30초 뒤 클립보드를 비운다 — 다른 앱이 나중에 붙여넣는 사고를 줄인다 (스펙 §4.4). */
function copyValue(text, message) {
  copyText(text, true, message ?? '복사했습니다 · 30초 뒤 클립보드를 비웁니다');
}

async function copyText(text, autoClear, message) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = el('textarea');
    ta.value = text;
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(message ?? '복사했습니다');
  clearTimeout(state.clipboardTimer);
  if (!autoClear) return;
  state.clipboardTimer = setTimeout(async () => {
    try {
      const current = await navigator.clipboard.readText();
      if (current === text) await navigator.clipboard.writeText('');
    } catch { /* 권한이 없으면 조용히 넘어간다 */ }
  }, 30000);
}

async function act(fn, message, after) {
  try {
    await fn();
    state.editing = null;
    closeModal();
    await load();
    if (after) { after(); renderAll(); }
    toast(message);
  } catch (err) {
    state.editing = null;
    toast('⚠️ ' + err.message);
    renderAll();
  }
}

function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => node.classList.remove('show'), 2800);
}

/** 전체 보기는 시간 제한을 둔다 — 자리를 비운 사이 화면에 평문이 남지 않게. */
function toggleRevealAll() {
  clearInterval(state.revealTimer);
  if (revealActive()) {
    state.revealAllUntil = 0;
    renderAll();
    return;
  }
  state.revealAllUntil = Date.now() + 15000;
  state.revealTimer = setInterval(() => {
    if (!revealActive()) {
      clearInterval(state.revealTimer);
      state.revealAllUntil = 0;
      renderAll();
      return;
    }
    renderTop();
  }, 1000);
  renderAll();
}

document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if (modalOpen()) return closeModal();
    if (state.editing) { state.editing = null; renderTree(); return renderDetail(); }
    if (document.activeElement === $('q') && state.q) { state.q = ''; $('q').value = ''; return renderTree(); }
    if (state.selected) { state.selected = null; renderTree(); renderDetail(); }
    return;
  }
  if (typing || modalOpen()) return;
  if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) {
    e.preventDefault();
    $('q').focus();
    $('q').select();
  }
});

load().catch((err) => {
  $('cards').textContent = '';

  $('cards').append(card);
  $('right').textContent = '';
  $('right').append(el('div', 'blank', err.message));
});
