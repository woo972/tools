# secret.yaml 원본 예시 — 이 상태로 디스크에 두거나 커밋하지 마세요.
#
# 사용법:
#   cp examples/secret.plaintext.yaml "$DKC_STORE/config/secret.yaml"
#   sops -e -i "$DKC_STORE/config/secret.yaml"     # value 하위만 암호화된다
#
# key/alias/resource_type/desc/ref는 암호화 후에도 평문으로 남는다.
# 그래서 개인키 없이도(축소 모드) alias 검색이 계속 동작한다.
items:
  - key: "DB_PASSWORD"
    resource_type: "password"
    alias: ["주문 DB 비밀번호"]
    value:
      prod: "prod-real-password"
      dev: "dev-password"
    desc: "메인 주문 DB 접속 비밀번호"
    ref: "https://internal-admin.example.com/db"

  - key: "INTERNAL_ADMIN_API_KEY"
    resource_type: "api_key"
    alias: ["관리자 API 키", "admin api key"]
    value:
      prod: "sk-prod-xxxxxxxx"
      dev: "sk-dev-xxxxxxxx"
    desc: "사내 관리자 콘솔 API 키"
    ref: "https://internal-admin.example.com/settings/api"
